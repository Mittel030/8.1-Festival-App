version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: festival_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: festival_app
      MYSQL_USER: festival_user
      MYSQL_PASSWORD: festival_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - festival_network

  php:
    image: php:7.4-apache
    container_name: festival_api
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=festival_user
      - MYSQL_PASSWORD=festival_password
      - MYSQL_DATABASE=festival_app
    networks:
      - festival_network
    command: >
      sh -c "a2enmod rewrite && apache2ctl restart && apache2-foreground"

networks:
  festival_network:
    driver: bridge

volumes:
  mysql_data:
